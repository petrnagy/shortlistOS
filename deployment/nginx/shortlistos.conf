server {
    listen 80;
    server_name shortlistos.co api.shortlistos.co hooks.shortlistos.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shortlistos.co;

    ssl_certificate /etc/nginx/ssl/shortlistos-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/shortlistos-origin-key.pem;

    client_max_body_size 50m;

    location = /api/shortlist_magic_clip {
        return 404;
    }
    location = /api/shortlist_magic_clip/ {
        return 404;
    }
    location = /api/partner/webhook {
        return 404;
    }
    location = /api/partner/webhook/ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name api.shortlistos.co;

    ssl_certificate /etc/nginx/ssl/shortlistos-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/shortlistos-origin-key.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name hooks.shortlistos.co;

    ssl_certificate /etc/nginx/ssl/shortlistos-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/shortlistos-origin-key.pem;

    client_max_body_size 50m;

    location = /api/shortlist_magic_inbox/incoming_webhook {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host shortlistos.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
