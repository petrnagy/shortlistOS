name: Build and deploy production

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full commit SHA already present on main to rebuild and deploy
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/petrnagy/shortlistos

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve release
        id: release
        run: |
          sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full commit SHA is required" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$sha" >> "$GITHUB_OUTPUT"

      - name: Verify manual release belongs to main
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        id: application
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: application
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.tag }}
          build-args: APP_VERSION=${{ steps.release.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build migration image
        id: migration
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrate
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}-migrate:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.2.4

      - name: Sign release images
        env:
          APP_DIGEST: ${{ steps.application.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REPOSITORY}@${APP_DIGEST}"
          cosign sign --yes "${IMAGE_REPOSITORY}-migrate@${MIGRATION_DIGEST}"

  deploy:
    needs: build
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        (startsWith(github.event.pull_request.head.ref, 'release/') ||
         startsWith(github.event.pull_request.head.ref, 'hotfix/'))))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shortlistos.co
    concurrency:
      group: shortlistos-production
      cancel-in-progress: false
    steps:
      - name: Configure restricted SSH client
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/shortlistos_deploy
          chmod 600 ~/.ssh/shortlistos_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          ssh -i ~/.ssh/shortlistos_deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE"
