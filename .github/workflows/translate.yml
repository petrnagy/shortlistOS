name: Translate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  translate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --filter @kan/web...

      - name: Extract translations
        working-directory: apps/web
        run: pnpm lingui:extract

      - name: Compile translations
        working-directory: apps/web
        run: pnpm lingui:compile

      - name: Verify generated translations are committed
        run: |
          if ! git diff --exit-code -- apps/web/src/locales/*/messages.ts; then
            echo "::error::Generated translations are stale. Run pnpm lingui:extract and pnpm lingui:compile in apps/web, then commit the results."
            exit 1
          fi
